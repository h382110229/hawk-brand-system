name: UI Foundation CI
on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm tokens:build
      - run: pnpm brand:sync
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Browser verification
        run: pnpm browser:verify
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: deliverables/ui-foundation-01/actual/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: deliverables/ui-foundation-01/actual/verification-report.json
          retention-days: 30
